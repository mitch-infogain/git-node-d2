services:
  mongo:
    image: mongo:8
    volumes:
      - day3-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    image: my-node-app:day3
    build: .
    ports:
      - "127.0.0.1:3001:8000"
    environment:
      PORT: "8000"
      MONGODB_URI: mongodb://mongo:27017/employees_mcp_bootcamp
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  day3-mongo: